server:
  port: ${PORT:8081}

spring:
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:reto_usuarios}
    username: ${DB_USER:postgres}
    password: ${DB_PASS:postgres}

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
  web:
    error:
      include-stacktrace: never

  flyway:
    enabled: true
    locations: classpath:db/migration

jwt:
  secret: ${JWT_SECRET:una-clave-secreta-de-al-menos-32-bytes}
  expiration: 3600000 # 1 hora en milisegundos

admin:
  seed:
    email: ${ADMIN_SEED_EMAIL:admin@pragma.com}
    password: ${ADMIN_SEED_PASSWORD:Admin123*}

appDescription: "User API"
appVersion: "1.0.0"
